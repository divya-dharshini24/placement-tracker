{% extends "base.html" %}
{% block content %}
<h1>Delete application</h1>
<p>Delete <strong>{{ application }}</strong>? This can't be undone.</p>
<form method="post">
  {% csrf_token %}
  <button class="btn btn-danger" type="submit">Yes, delete</button>
  <a class="btn btn-secondary" href="{% url 'application_list' %}">Cancel</a>
</form>
{% endblock %}
